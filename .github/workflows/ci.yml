name: Check crawler and parser

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q src
      - name: Check notebook JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in [*Path("docs").glob("*.ipynb"), Path("colab_crawler.ipynb")]:
              book = json.loads(path.read_text(encoding="utf-8"))
              assert book["nbformat"] == 4, path
              assert isinstance(book["cells"], list), path
          PY
      - name: Check package installation
        run: python -m pip install -e .
      - name: Check installed commands outside repository
        working-directory: /tmp
        run: |
          arxiv-harvester --help
          arxiv-parser --help
          arxiv-audit-sources --help
          arxiv-validate-project --help
